services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Neon PostgreSQL connection string}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-in-production
      AI_SERVICE_URL: http://ai-service:7000
    ports:
      - "4000:4000"
    depends_on:
      - redis

  ai-service:
    build: ./ai-service
    ports:
      - "7000:7000"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

