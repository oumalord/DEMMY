services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rentflow
      POSTGRES_USER: rentflow
      POSTGRES_PASSWORD: rentflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - rentflow_postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://rentflow:rentflow_dev_password@postgres:5432/rentflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-in-production
      AI_SERVICE_URL: http://ai-service:7000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  ai-service:
    build: ./ai-service
    ports:
      - "7000:7000"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  rentflow_postgres:
